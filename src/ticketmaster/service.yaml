AWSTemplateFormatVersion: '2010-09-09'
Description: Ticketmaster FastAPI service on ECS Express Mode

Parameters:
  ImageTag:
    Type: String
    Description: ECR image tag to deploy (git SHA).
  Environment:
    Type: String
    AllowedValues: [test-eu]
  ExecutionRoleArn:
    Type: String
    Description: Task execution role (ECR pull + log writes). Passed from a GitHub Actions variable in CI.
  InfrastructureRoleArn:
    Type: String
    Description: Role ECS uses to manage ALB/TGs/SGs/alarms on our behalf. Passed from a GitHub Actions variable in CI.

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/ticketmaster-${Environment}'
      RetentionInDays: 14

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: kms-get-public-key
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: kms:GetPublicKey
                Resource: !Sub '{{resolve:ssm:/ticketmaster/ticketmaster/${Environment}/LAMBDA_JWT_KMS_KEY_ARN}}'
        - PolicyName: cognito-admin-delete-user
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cognito-idp:AdminDeleteUser
                Resource: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*'

  Service:
    Type: AWS::ECS::ExpressGatewayService
    Properties:
      ServiceName: !Sub 'ticketmaster-${Environment}'
      Cluster: default
      Cpu: '512'
      Memory: '1024'
      HealthCheckPath: /readiness_check
      ExecutionRoleArn: !Ref ExecutionRoleArn
      TaskRoleArn: !GetAtt TaskRole.Arn
      InfrastructureRoleArn: !Ref InfrastructureRoleArn
      PrimaryContainer:
        Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/ticketmaster:${ImageTag}'
        ContainerPort: 8080
        AwsLogsConfiguration:
          LogGroup: !Ref LogGroup
          LogStreamPrefix: ticketmaster
        Secrets:
          - Name: ENVIRONMENT
            ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ticketmaster/ticketmaster/${Environment}/ENVIRONMENT'
          - Name: SENTRY_SEND_PII
            ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ticketmaster/ticketmaster/${Environment}/SENTRY_SEND_PII'
          - Name: SENTRY_TRACES_SAMPLE_RATE
            ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ticketmaster/ticketmaster/${Environment}/SENTRY_TRACES_SAMPLE_RATE'
          - Name: POSTGRES_DB_URL
            ValueFrom: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:ticketmaster/ticketmaster/${Environment}/POSTGRES_DB_URL'
          - Name: SENTRY_DSN
            ValueFrom: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:ticketmaster/ticketmaster/${Environment}/SENTRY_DSN'
          - Name: LAMBDA_JWT_KMS_KEY_ARN
            ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ticketmaster/ticketmaster/${Environment}/LAMBDA_JWT_KMS_KEY_ARN'
          - Name: LAMBDA_JWT_AUDIENCE
            ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ticketmaster/ticketmaster/${Environment}/LAMBDA_JWT_AUDIENCE'
          - Name: LAMBDA_JWT_ISSUER
            ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ticketmaster/ticketmaster/${Environment}/LAMBDA_JWT_ISSUER'
          - Name: COGNITO_AUDIENCE
            ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ticketmaster/ticketmaster/${Environment}/COGNITO_AUDIENCE'
      ScalingTarget:
        AutoScalingMetric: AVERAGE_CPU
        AutoScalingTargetValue: 90
        MinTaskCount: 1
        MaxTaskCount: 1

Outputs:
  ServiceArn:
    Value: !GetAtt Service.ServiceArn
  ServiceUrl:
    Description: Public hostname assigned by Express Mode
    Value: !GetAtt Service.Endpoint
  LogGroupName:
    Value: !Ref LogGroup
  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn

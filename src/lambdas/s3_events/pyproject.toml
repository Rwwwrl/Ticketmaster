[tool.poetry]
name = "s3-events-lambda"
version = "0.1.0"
description = "S3 ObjectCreated trigger — dumb forwarder that HEADs the object and POSTs {bucket, key, metadata} to ticketmaster /api/admin/s3-events."
authors = ["Aleksei Sosov <forgithublesh@yandex.ru>"]
packages = [{ include = "s3_events" }]

[tool.poetry.dependencies]
python = "^3.14"
httpx = "^0.28.1"
tenacity = "^9.0.0"
respx = "^0.23.1"
pyjwt = "^2.12.1"
cryptography = "^48.0.0"
boto3 = ">=1.40.46,<1.40.62"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
env = [
    "TICKETMASTER_API_URL=https://ticketmaster.test.invalid",
    "AWS_REGION=eu-central-1",
    "S3_EVENTS_JWT_KMS_KEY_ARN=arn:aws:kms:eu-central-1:000000000000:key/test-s3-events-placeholder",
    "JWT_AUDIENCE=ticketmaster-backend",
    "S3_EVENTS_JWT_ISSUER=ticketmaster-s3-events",
    "LAMBDA_ROLE_ARN=arn:aws:iam::000000000000:role/ticketmaster-s3-events",
]

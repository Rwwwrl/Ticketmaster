[tool.poetry]
name = "cognito-pre-signup-lambda"
version = "0.1.0"
description = "Cognito PreSignUp trigger — calls ticketmaster /v1/users/ to create the DB row before Cognito persists the identity."
authors = ["Aleksei Sosov <forgithublesh@yandex.ru>"]
packages = [{ include = "cognito_pre_signup" }]

[tool.poetry.dependencies]
python = "^3.14"
httpx = "^0.28.1"
tenacity = "^9.0.0"
# boto3 is provided by the Lambda runtime — pinned here so the package zip skips it via --without
boto3 = "^1.43.6"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
respx = "^0.22.0"
pyjwt = "^2.12.1"
cryptography = "^48.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
env = [
    "TICKETMASTER_API_URL=https://ticketmaster.test.invalid",
    "AWS_REGION=eu-central-1",
    "JWT_KMS_KEY_ARN=arn:aws:kms:eu-central-1:000000000000:key/test-placeholder",
    "JWT_AUDIENCE=ticketmaster-backend",
    "JWT_ISSUER=ticketmaster-cognito-pre-signup",
    "LAMBDA_ROLE_ARN=arn:aws:iam::000000000000:role/ticketmaster-cognito-pre-signup",
]

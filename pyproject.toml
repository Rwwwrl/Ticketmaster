[tool.poetry]
name = "ticketmaster-workspace"
version = "0.0.1"
description = "Workspace pyproject — dev tooling + path deps to the deployable sub-packages."
authors = ["Aleksei Sosov <forgithublesh@yandex.ru>"]
package-mode = false

[build-system]
requires = ["poetry-core"]

[tool.poetry.dependencies]
python = "^3.14"
ticketmaster-libs = {path = "src/libs", develop = true}
ticketmaster = {path = "src/ticketmaster", develop = true}

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.5.1"
pytest-cov = "^5.0.0"
ipython = "^8.0.0"
pytest-env = "^1.6.0"
ruff = "^0.15.10"
pytest = "^9.0.3"
pytest-asyncio = "^1.3.0"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "session"
addopts = "--import-mode=importlib -p libs.tests_ext.sqlmodel_fixtures"
env = [
    "ENVIRONMENT=cicd",
    "POSTGRES_DB_URL=postgresql+asyncpg://postgres:postgres@localhost:15432/postgres",
    "AWS_REGION=eu-central-1",
    "LAMBDA_JWT_KMS_KEY_ARN=arn:aws:kms:eu-central-1:000000000000:key/test-placeholder",
    "LAMBDA_JWT_AUDIENCE=ticketmaster-backend",
    "LAMBDA_JWT_ISSUER=ticketmaster-cognito-pre-signup",
]
testpaths = ["src/libs/libs/tests", "src/ticketmaster/ticketmaster/tests"]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["B", "C", "E", "F", "I", "W"]
ignore = ["E722", "B904", "B006", "B008"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*" = ["E501"]
"**/__init__.py" = ["F401"]

---
# Source: ticketmaster/templates/infra/services/hello-world/external-secret.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hello-world
  labels:
    app: hello-world
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    force-sync: "76316e61adb135ed0e3e5827abee4a4819d5f933"
spec:
  refreshInterval: 1h
  target:
    name: hello-world
    creationPolicy: Owner
  data:
    - secretKey: SECRET
      remoteRef:
        key: ticketmaster/hello-world/test-eu/SECRET
      sourceRef:
        storeRef:
          name: aws-secret-store-secrets-manager
          kind: ClusterSecretStore
    - secretKey: ENVIRONMENT
      remoteRef:
        key: /ticketmaster/hello-world/test-eu/ENVIRONMENT
      sourceRef:
        storeRef:
          name: aws-secret-store-parameter-store
          kind: ClusterSecretStore
    - secretKey: POSTGRES_DB_URL
      remoteRef:
        key: ticketmaster/hello-world/test-eu/POSTGRES_DB_URL
      sourceRef:
        storeRef:
          name: aws-secret-store-secrets-manager
          kind: ClusterSecretStore

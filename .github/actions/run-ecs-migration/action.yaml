name: Run ECS migration
description: Run an alembic migration as a Fargate one-shot task, poll to completion, dump CloudWatch logs on failure.

inputs:
  environment:
    required: true
    description: Environment name (e.g. test-eu); used to look up SSM params under /ticketmaster/<env>/.
  stack_name:
    required: true
    description: CloudFormation stack name that owns the migration TaskDefinition + LogGroup.
  command:
    required: true
    description: Full command to run inside the migration container, e.g. "poetry run alembic upgrade expand@head".

runs:
  using: composite
  steps:
    - shell: bash
      env:
        ENV: ${{ inputs.environment }}
        STACK_NAME: ${{ inputs.stack_name }}
        COMMAND: ${{ inputs.command }}
      run: |
        set -euo pipefail

        SUBNETS=$(aws ssm get-parameter --name "/ticketmaster/$ENV/migration_subnets" --query Parameter.Value --output text)
        SG=$(aws ssm get-parameter --name "/ticketmaster/$ENV/migration_security_group" --query Parameter.Value --output text)
        CLUSTER=$(aws ssm get-parameter --name "/ticketmaster/$ENV/cluster_name" --query Parameter.Value --output text)

        TD_ARN=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
          --query 'Stacks[0].Outputs[?OutputKey==`MigrationTaskDefinitionArn`].OutputValue' --output text)
        LOG_GROUP=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
          --query 'Stacks[0].Outputs[?OutputKey==`LogGroupName`].OutputValue' --output text)

        OVERRIDES=$(jq -nc --arg cmd "$COMMAND" '{containerOverrides:[{name:"migrate",command:($cmd|split(" "))}]}')

        TASK_ARN=$(aws ecs run-task \
          --cluster "$CLUSTER" \
          --task-definition "$TD_ARN" \
          --launch-type FARGATE \
          --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=ENABLED}" \
          --overrides "$OVERRIDES" \
          --query 'tasks[0].taskArn' --output text)
        echo "Started task: $TASK_ARN"

        DEADLINE=$((SECONDS + 1800))
        while true; do
          STATUS=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" --query 'tasks[0].lastStatus' --output text)
          echo "lastStatus=$STATUS"
          [ "$STATUS" = "STOPPED" ] && break
          if [ $SECONDS -ge $DEADLINE ]; then
            echo "::error::Migration timed out after 30 min"
            aws ecs stop-task --cluster "$CLUSTER" --task "$TASK_ARN" --reason "CI timeout" || true
            exit 1
          fi
          sleep 10
        done

        EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" --query 'tasks[0].containers[0].exitCode' --output text)
        STOP_REASON=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" --query 'tasks[0].stoppedReason' --output text)
        echo "exitCode=$EXIT_CODE stoppedReason=$STOP_REASON"

        if [ "$EXIT_CODE" != "0" ]; then
          TASK_ID="${TASK_ARN##*/}"
          echo "::group::CloudWatch logs for $TASK_ID"
          aws logs tail "$LOG_GROUP" --log-stream-names "migrate/migrate/$TASK_ID" || true
          echo "::endgroup::"
          echo "::error::migration command failed: $COMMAND (exit=$EXIT_CODE)"
          exit 1
        fi

name: Run ECS migration
description: Run a one-shot ECS Fargate task against a migration TaskDefinition. Discovers default-VPC networking at deploy time and delegates the run-task dance to geekcell/github-action-aws-ecs-run-task.

inputs:
  stack_name:
    required: true
    description: CloudFormation stack name that owns the migration TaskDefinition (must export MigrationTaskDefinitionArn).
  command:
    required: true
    description: Full command to run inside the migration container, e.g. "poetry run alembic upgrade expand@head". Tokens split on whitespace.

runs:
  using: composite
  steps:
    - name: Resolve TaskDefinition ARN and default-VPC networking
      id: resolve
      shell: bash
      env:
        STACK_NAME: ${{ inputs.stack_name }}
      run: |
        set -euo pipefail

        TD_ARN=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
          --query 'Stacks[0].Outputs[?OutputKey==`MigrationTaskDefinitionArn`].OutputValue' --output text)

        VPC_ID=$(aws ec2 describe-vpcs --filters Name=isDefault,Values=true \
          --query 'Vpcs[0].VpcId' --output text)

        SUBNETS=$(aws ec2 describe-subnets --filters Name=vpc-id,Values=$VPC_ID \
          --query 'Subnets[].SubnetId' --output text | tr '\t' '\n')

        SG=$(aws ec2 describe-security-groups --filters Name=vpc-id,Values=$VPC_ID Name=group-name,Values=default \
          --query 'SecurityGroups[0].GroupId' --output text)

        {
          echo "td_arn=$TD_ARN"
          echo "sg=$SG"
          echo "subnets<<EOF"
          echo "$SUBNETS"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Run migration task
      uses: geekcell/github-action-aws-ecs-run-task@ef36e9172ca49a67bb99ab59130fe5c5e9622257 # v5.0.1
      with:
        cluster: default
        task-definition: ${{ steps.resolve.outputs.td_arn }}
        subnet-ids: ${{ steps.resolve.outputs.subnets }}
        security-group-ids: ${{ steps.resolve.outputs.sg }}
        assign-public-ip: ENABLED
        override-container: migrate
        override-container-command: ${{ inputs.command }}
        tail-logs: "true"
        task-stop-max-wait-time: 300

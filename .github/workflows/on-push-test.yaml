name: Deploy to Test

on:
  push:
    branches:
      - "test/**"

permissions:
  contents: read
  id-token: write

jobs:
  publish-libs:
    uses: ./.github/workflows/called-publish-python-package.yaml
    with:
      environment: test-eu
      package_path: src/libs
    secrets: inherit

  deploy-ticketmaster:
    needs: [publish-libs]
    uses: ./.github/workflows/called-deploy-container-service.yaml
    with:
      environment: test-eu
      service_name: ticketmaster
      service_path: src/ticketmaster
      run_migrations: true
    secrets: inherit

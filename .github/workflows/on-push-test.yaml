name: Deploy to Test

on:
  push:
    branches:
      - "test/**"

permissions:
  contents: write
  id-token: write

concurrency:
  group: deploy-test-eu
  cancel-in-progress: false

jobs:
  publish-libs:
    uses: ./.github/workflows/called-publish-python-package.yaml
    with:
      environment: test-eu
      package_path: src/libs
    secrets: inherit

  publish-services-docker-images:
    needs: [publish-libs]
    uses: ./.github/workflows/called-publish-docker-images.yaml
    with:
      environment: test-eu
    secrets: inherit

  render-manifests:
    needs: [publish-services-docker-images]
    uses: ./.github/workflows/called-publish-env-manifests.yaml
    with:
      environment: test-eu

  deploy-cognito-pre-signup-lambda:
    uses: ./.github/workflows/called-deploy-lambda.yaml
    with:
      environment: test-eu
      lambda_name: ticketmaster-cognito-pre-signup-test-eu
      lambda_path: src/lambdas/cognito_pre_signup
    secrets: inherit

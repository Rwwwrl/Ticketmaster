name: Helm Upgrade on EKS

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      chart:
        required: true
        type: string

jobs:
  helm-upgrade:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.DEPLOYER_TO_AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name ${{ vars.EKS_CLUSTER_NAME }} \
            --region ${{ vars.AWS_REGION }}

      - name: Helm upgrade
        run: |
          if [ "${{ inputs.environment }}" != "test-eu" ]; then
            echo "Unexpected environment: ${{ inputs.environment }}" >&2
            exit 1
          fi

          case "${{ inputs.chart }}" in
            infra)
              helm upgrade --install infra ./deploy/infra \
                --wait \
                --timeout 10m
              ;;
            application)
              helm upgrade --install application ./deploy/application \
                -f ./deploy/application/values.test.yaml \
                --set helloWorld.image.tag=${{ github.sha }} \
                --wait \
                --timeout 10m
              ;;
            *)
              echo "Unexpected chart: ${{ inputs.chart }}" >&2
              exit 1
              ;;
          esac

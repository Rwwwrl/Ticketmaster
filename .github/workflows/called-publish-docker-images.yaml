name: Publish Service Docker Images

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  publish-services-docker-images:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.DEPLOYER_TO_AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        env:
          REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
        run: |
          CODEARTIFACT_TOKEN=$(aws codeartifact get-authorization-token \
            --domain ${{ vars.CODEARTIFACT_DOMAIN }} \
            --query authorizationToken \
            --output text)
          echo "::add-mask::$CODEARTIFACT_TOKEN"
          export CODEARTIFACT_TOKEN

          REPO_URL=$(aws codeartifact get-repository-endpoint \
            --domain ${{ vars.CODEARTIFACT_DOMAIN }} \
            --repository ${{ vars.CODEARTIFACT_REPOSITORY }} \
            --format pypi \
            --query repositoryEndpoint \
            --output text)

          images=(
            "hello-world:src/hello_world"
            "ticketmaster:src/ticketmaster"
            "frontend:frontend"
          )

          for entry in "${images[@]}"; do
            image_name="${entry%%:*}"
            context="${entry#*:}"
            image=$REGISTRY/$image_name:${{ github.sha }}
            docker build \
              --secret id=codeartifact_token,env=CODEARTIFACT_TOKEN \
              --build-arg CODEARTIFACT_INDEX_URL="${REPO_URL}simple/" \
              -t "$image" "$context"
            docker push "$image"
          done

name: Deploy Container Service to ECS

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      service_name:
        required: true
        type: string
      service_path:
        required: true
        type: string
      run_migrations:
        required: false
        type: boolean

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.DEPLOYER_TO_AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
        run: |
          IMAGE=$REGISTRY/${{ inputs.service_name }}:${{ github.sha }}

          CODEARTIFACT_TOKEN=$(aws codeartifact get-authorization-token \
            --domain ${{ vars.CODEARTIFACT_DOMAIN }} \
            --query authorizationToken --output text)

          echo "::add-mask::$CODEARTIFACT_TOKEN"

          export CODEARTIFACT_TOKEN

          REPO_URL=$(aws codeartifact get-repository-endpoint \
            --domain ${{ vars.CODEARTIFACT_DOMAIN }} \
            --repository ${{ vars.CODEARTIFACT_REPOSITORY }} \
            --format pypi --query repositoryEndpoint --output text)

          docker build \
            --secret id=codeartifact_token,env=CODEARTIFACT_TOKEN \
            --build-arg CODEARTIFACT_INDEX_URL="${REPO_URL}simple/" \
            -t $IMAGE ${{ inputs.service_path }}

          docker push $IMAGE

      - name: Deploy migration CloudFormation stack
        if: ${{ inputs.run_migrations }}
        run: |
          aws cloudformation deploy \
            --stack-name ${{ inputs.service_name }}-${{ inputs.environment }}-migrate \
            --template-file ${{ inputs.service_path }}/migration.yaml \
            --parameter-overrides \
                ImageTag=${{ github.sha }} \
                Environment=${{ inputs.environment }} \
                ExecutionRoleArn=${{ vars.ECS_EXECUTION_ROLE_ARN }} \
            --no-fail-on-empty-changeset \
            --region ${{ vars.AWS_REGION }}

      - name: Run expand migrations
        if: ${{ inputs.run_migrations }}
        uses: ./.github/actions/run-ecs-migration
        with:
          stack_name: ${{ inputs.service_name }}-${{ inputs.environment }}-migrate
          command: poetry run alembic upgrade expand@head

      - name: Delete service stack if stuck in ROLLBACK_COMPLETE
        run: |
          STACK=${{ inputs.service_name }}-${{ inputs.environment }}
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK" \
            --region ${{ vars.AWS_REGION }} \
            --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo NONE)
          if [ "$STATUS" = "ROLLBACK_COMPLETE" ]; then
            echo "Stack $STACK is in ROLLBACK_COMPLETE (failed initial create) — deleting before redeploy"
            aws cloudformation delete-stack --stack-name "$STACK" --region ${{ vars.AWS_REGION }}
            aws cloudformation wait stack-delete-complete --stack-name "$STACK" --region ${{ vars.AWS_REGION }}
          fi

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --stack-name ${{ inputs.service_name }}-${{ inputs.environment }} \
            --template-file ${{ inputs.service_path }}/service.yaml \
            --parameter-overrides \
                ImageTag=${{ github.sha }} \
                Environment=${{ inputs.environment }} \
                ExecutionRoleArn=${{ vars.ECS_EXECUTION_ROLE_ARN }} \
                InfrastructureRoleArn=${{ vars.ECS_INFRASTRUCTURE_ROLE_ARN }} \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --region ${{ vars.AWS_REGION }}

      - name: Run contract migrations
        if: ${{ inputs.run_migrations }}
        uses: ./.github/actions/run-ecs-migration
        with:
          stack_name: ${{ inputs.service_name }}-${{ inputs.environment }}-migrate
          command: poetry run alembic upgrade contract@head

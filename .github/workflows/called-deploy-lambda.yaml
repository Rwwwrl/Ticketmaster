name: Deploy Lambda Function

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      lambda_name:
        required: true
        type: string
        description: AWS Lambda function name (e.g. ticketmaster-cognito-pre-signup-test-eu).
      lambda_path:
        required: true
        type: string
        description: Path to the Lambda package (e.g. src/lambdas/cognito_pre_signup). Its last path segment must equal the Python package directory inside it, which must expose handler.lambda_handler.

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Poetry 2.4.1
        run: |
          pipx install poetry==2.4.1
          pipx inject poetry poetry-plugin-export

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.DEPLOYER_TO_AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Derive package name and handler
        run: |
          # NOTE @sosov: every lambda package's directory name equals its Python package name,
          # and its handler is always <package_name>.handler.lambda_handler — see lambda_path.
          PACKAGE_NAME="$(basename "${{ inputs.lambda_path }}")"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"
          echo "HANDLER=${PACKAGE_NAME}.handler.lambda_handler" >> "$GITHUB_ENV"

      - name: Build deployment package
        working-directory: ${{ inputs.lambda_path }}
        run: |
          rm -rf build && mkdir -p build/package
          poetry export --without-hashes -f requirements.txt -o build/requirements.txt
          # Install dependencies with manylinux wheels for the Lambda runtime.
          pip install \
            --target build/package \
            --platform manylinux2014_x86_64 \
            --only-binary=:all: \
            --implementation cp \
            --python-version 3.14 \
            -r build/requirements.txt
          cp -r "$PACKAGE_NAME" build/package/

      - name: Deploy Lambda CloudFormation stack
        run: |
          aws cloudformation deploy \
            --stack-name ${{ inputs.lambda_name }} \
            --template-file ${{ inputs.lambda_path }}/lambda.yaml \
            --parameter-overrides \
                Environment=${{ inputs.environment }} \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --region ${{ vars.AWS_REGION }}

      - uses: aws-actions/aws-lambda-deploy@v1.1.1
        with:
          function-name: ${{ inputs.lambda_name }}
          code-artifacts-dir: ${{ inputs.lambda_path }}/build/package
          handler: ${{ env.HANDLER }}
          runtime: python3.14
          publish: true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: application-{{ trimPrefix "env/" .Values.argocd.application.targetRevision }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.argocd.meta.argocd.syncWave | quote }}
spec:
  project: default
  source:
    repoURL: {{ .Values.argocd.application.repoURL }}
    path: .
    targetRevision: {{ .Values.argocd.application.targetRevision }}
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m

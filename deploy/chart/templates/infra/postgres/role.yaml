apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgres
  labels:
    app: postgres
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.infra.postgres.meta.argocd.syncWave | quote }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create, get, list, patch, update, watch, delete, deletecollection]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, patch, update, watch]

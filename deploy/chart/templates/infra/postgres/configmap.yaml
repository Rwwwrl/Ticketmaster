apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  labels:
    app: postgres
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.infra.postgres.meta.argocd.syncWave | quote }}
data:
  10-create-app-db.sh: |
    #!/bin/bash
    set -euo pipefail
    : "${APP_DB_PASSWORD:?}"
    psql -v ON_ERROR_STOP=1 --username postgres --dbname postgres -v app_password="$APP_DB_PASSWORD" <<'SQL'
    CREATE ROLE ticketmaster LOGIN PASSWORD :'app_password';
    CREATE DATABASE ticketmaster OWNER ticketmaster;
    SQL

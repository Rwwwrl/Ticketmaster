apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: postgres
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.infra.postgres.meta.argocd.syncWave | quote }}
spec:
  replicas: 3
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Delete
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        cluster-name: postgres
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/infra/postgres/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: postgres
      terminationGracePeriodSeconds: 120
      enableServiceLinks: false
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: postgres
      containers:
        - name: postgres
          image: '{{ .Values.infra.postgres.image.repository }}:{{ .Values.infra.postgres.image.tag }}'
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
            - name: patroni
              containerPort: 8008
              protocol: TCP
          env:
            - name: PATRONI_KUBERNETES_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: PATRONI_KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PATRONI_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PATRONI_SCOPE
              value: postgres
            - name: PATRONI_KUBERNETES_LABELS
              value: '{app: postgres}'
            - name: PATRONI_KUBERNETES_USE_ENDPOINTS
              value: "false"
            - name: PATRONI_POSTGRESQL_CONNECT_ADDRESS
              value: $(PATRONI_KUBERNETES_POD_IP):5432
            - name: PATRONI_RESTAPI_CONNECT_ADDRESS
              value: $(PATRONI_KUBERNETES_POD_IP):8008
            - name: PATRONI_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: SUPERUSER_PASSWORD
            - name: PATRONI_REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: REPLICATION_PASSWORD
            - name: PATRONI_REWIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: REWIND_PASSWORD
            - name: PATRONI_RESTAPI_USERNAME
              value: patroni
            - name: PATRONI_RESTAPI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: RESTAPI_PASSWORD
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: APP_PASSWORD
          readinessProbe:
            httpGet:
              path: /readiness
              port: patroni
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /liveness
              port: patroni
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql
            - name: patroni-config
              mountPath: /etc/patroni
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: patroni-config
          configMap:
            name: postgres-patroni
            defaultMode: 0555
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: postgres-gp3
        resources:
          requests:
            storage: 10Gi

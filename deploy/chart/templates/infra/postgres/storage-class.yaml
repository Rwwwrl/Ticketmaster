apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: postgres-gp3
  labels:
    app: postgres
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.infra.postgres.meta.argocd.syncWave | quote }}
provisioner: ebs.csi.eks.amazonaws.com
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
parameters:
  type: gp3
  encrypted: "true"

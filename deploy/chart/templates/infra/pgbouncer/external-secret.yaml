apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pgbouncer
  labels:
    app: pgbouncer
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.infra.meta.argocd.syncWave | quote }}
    force-sync: {{ .Values.commitSha | quote }}
spec:
  refreshInterval: 1h
  target:
    name: pgbouncer
    creationPolicy: Owner
  data:
    - secretKey: userlist.txt
      remoteRef:
        key: {{ .Values.infra.pgbouncer.secrets.prefix }}/USERLIST_TXT
      sourceRef:
        storeRef:
          name: aws-secret-store-secrets-manager
          kind: ClusterSecretStore

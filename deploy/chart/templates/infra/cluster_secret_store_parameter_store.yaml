apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: hello-world-parameter-store
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.infra.argocd.syncWave | quote }}
spec:
  provider:
    aws:
      service: ParameterStore
      region: {{ .Values.aws.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: eso
            namespace: default

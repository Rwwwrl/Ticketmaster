apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hello-world
  labels:
    app: hello-world
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.infra.meta.argocd.syncWave | quote }}
    force-sync: {{ .Values.commitSha | quote }}
spec:
  refreshInterval: 1h
  target:
    name: hello-world
    creationPolicy: Owner
  data:
    - secretKey: SECRET
      remoteRef:
        key: {{ .Values.infra.services.helloWorld.secrets.prefix }}/SECRET
      sourceRef:
        storeRef:
          name: aws-secret-store-secrets-manager
          kind: ClusterSecretStore
    - secretKey: ENVIRONMENT
      remoteRef:
        key: /{{ .Values.infra.services.helloWorld.secrets.prefix }}/ENVIRONMENT
      sourceRef:
        storeRef:
          name: aws-secret-store-parameter-store
          kind: ClusterSecretStore
    - secretKey: POSTGRES_DB_URL
      remoteRef:
        key: {{ .Values.infra.services.helloWorld.secrets.prefix }}/POSTGRES_DB_URL
      sourceRef:
        storeRef:
          name: aws-secret-store-secrets-manager
          kind: ClusterSecretStore

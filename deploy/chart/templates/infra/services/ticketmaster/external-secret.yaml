apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ticketmaster
  labels:
    app: ticketmaster
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.infra.meta.argocd.syncWave | quote }}
    force-sync: {{ .Values.commitSha | quote }}
spec:
  refreshInterval: 1h
  target:
    name: ticketmaster
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_DB_URL
      remoteRef:
        key: {{ .Values.infra.services.ticketmaster.secrets.prefix }}/POSTGRES_DB_URL
      sourceRef:
        storeRef:
          name: aws-secret-store-secrets-manager
          kind: ClusterSecretStore
    - secretKey: REDIS_URL
      remoteRef:
        key: {{ .Values.infra.services.ticketmaster.secrets.prefix }}/REDIS_URL
      sourceRef:
        storeRef:
          name: aws-secret-store-secrets-manager
          kind: ClusterSecretStore
    - secretKey: SECRET
      remoteRef:
        key: {{ .Values.infra.services.ticketmaster.secrets.prefix }}/SECRET
      sourceRef:
        storeRef:
          name: aws-secret-store-secrets-manager
          kind: ClusterSecretStore
    - secretKey: SENTRY_DSN
      remoteRef:
        key: {{ .Values.infra.services.ticketmaster.secrets.prefix }}/SENTRY_DSN
      sourceRef:
        storeRef:
          name: aws-secret-store-secrets-manager
          kind: ClusterSecretStore
    - secretKey: ENVIRONMENT
      remoteRef:
        key: /{{ .Values.infra.services.ticketmaster.secrets.prefix }}/ENVIRONMENT
      sourceRef:
        storeRef:
          name: aws-secret-store-parameter-store
          kind: ClusterSecretStore
    - secretKey: SENTRY_SEND_PII
      remoteRef:
        key: /{{ .Values.infra.services.ticketmaster.secrets.prefix }}/SENTRY_SEND_PII
      sourceRef:
        storeRef:
          name: aws-secret-store-parameter-store
          kind: ClusterSecretStore
    - secretKey: SENTRY_TRACES_SAMPLE_RATE
      remoteRef:
        key: /{{ .Values.infra.services.ticketmaster.secrets.prefix }}/SENTRY_TRACES_SAMPLE_RATE
      sourceRef:
        storeRef:
          name: aws-secret-store-parameter-store
          kind: ClusterSecretStore
    - secretKey: AWS_REGION
      remoteRef:
        key: /{{ .Values.infra.services.ticketmaster.secrets.prefix }}/AWS_REGION
      sourceRef:
        storeRef:
          name: aws-secret-store-parameter-store
          kind: ClusterSecretStore
    - secretKey: JWT_AUDIENCE
      remoteRef:
        key: /{{ .Values.infra.services.ticketmaster.secrets.prefix }}/JWT_AUDIENCE
      sourceRef:
        storeRef:
          name: aws-secret-store-parameter-store
          kind: ClusterSecretStore
    - secretKey: LAMBDA_JWT_KMS_KEY_ARN
      remoteRef:
        key: /{{ .Values.infra.services.ticketmaster.secrets.prefix }}/LAMBDA_JWT_KMS_KEY_ARN
      sourceRef:
        storeRef:
          name: aws-secret-store-parameter-store
          kind: ClusterSecretStore
    - secretKey: LAMBDA_JWT_ISSUER
      remoteRef:
        key: /{{ .Values.infra.services.ticketmaster.secrets.prefix }}/LAMBDA_JWT_ISSUER
      sourceRef:
        storeRef:
          name: aws-secret-store-parameter-store
          kind: ClusterSecretStore
    - secretKey: ADMIN_JWT_KMS_KEY_ARN
      remoteRef:
        key: /{{ .Values.infra.services.ticketmaster.secrets.prefix }}/ADMIN_JWT_KMS_KEY_ARN
      sourceRef:
        storeRef:
          name: aws-secret-store-parameter-store
          kind: ClusterSecretStore
    - secretKey: ADMIN_JWT_ISSUER
      remoteRef:
        key: /{{ .Values.infra.services.ticketmaster.secrets.prefix }}/ADMIN_JWT_ISSUER
      sourceRef:
        storeRef:
          name: aws-secret-store-parameter-store
          kind: ClusterSecretStore
    - secretKey: COGNITO_AUDIENCE
      remoteRef:
        key: /{{ .Values.infra.services.ticketmaster.secrets.prefix }}/COGNITO_AUDIENCE
      sourceRef:
        storeRef:
          name: aws-secret-store-parameter-store
          kind: ClusterSecretStore

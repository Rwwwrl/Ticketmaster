apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.infra.meta.argocd.syncWave | quote }}
    force-sync: {{ .Values.commitSha | quote }}
spec:
  refreshInterval: 1h
  target:
    name: rabbitmq
    creationPolicy: Owner
  data:
    - secretKey: RABBITMQ_URL
      remoteRef:
        key: {{ .Values.infra.externalSecrets.rabbitmq.prefix }}/RABBITMQ_URL
      sourceRef:
        storeRef:
          name: aws-secret-store-secrets-manager
          kind: ClusterSecretStore

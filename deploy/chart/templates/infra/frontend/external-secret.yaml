apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frontend
  labels:
    app: frontend
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.infra.meta.argocd.syncWave | quote }}
    force-sync: {{ .Values.commitSha | quote }}
spec:
  refreshInterval: 1h
  target:
    name: frontend
    creationPolicy: Owner
  data:
    - secretKey: BACKEND_URL
      remoteRef:
        key: /{{ .Values.infra.frontend.secrets.prefix }}/BACKEND_URL
      sourceRef:
        storeRef:
          name: aws-secret-store-parameter-store
          kind: ClusterSecretStore
    - secretKey: COGNITO_USER_POOL_ID
      remoteRef:
        key: /{{ .Values.infra.frontend.secrets.prefix }}/COGNITO_USER_POOL_ID
      sourceRef:
        storeRef:
          name: aws-secret-store-parameter-store
          kind: ClusterSecretStore
    - secretKey: COGNITO_USER_POOL_CLIENT_ID
      remoteRef:
        key: /{{ .Values.infra.frontend.secrets.prefix }}/COGNITO_USER_POOL_CLIENT_ID
      sourceRef:
        storeRef:
          name: aws-secret-store-parameter-store
          kind: ClusterSecretStore
    - secretKey: COGNITO_DOMAIN
      remoteRef:
        key: /{{ .Values.infra.frontend.secrets.prefix }}/COGNITO_DOMAIN
      sourceRef:
        storeRef:
          name: aws-secret-store-parameter-store
          kind: ClusterSecretStore

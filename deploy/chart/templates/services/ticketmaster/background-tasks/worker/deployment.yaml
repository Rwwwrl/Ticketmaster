apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketmaster-worker
  labels:
    app: ticketmaster-worker
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.services.ticketmaster.meta.argocd.syncWave | quote }}
spec:
  replicas: {{ .Values.services.ticketmaster.backgroundTasks.worker.replicas }}
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: ticketmaster-worker
  template:
    metadata:
      labels:
        app: ticketmaster-worker
    spec:
      serviceAccountName: ticketmaster
      terminationGracePeriodSeconds: 90
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ticketmaster-worker
      containers:
        - name: ticketmaster-worker
          image: '{{ .Values.services.ticketmaster.image.repository }}:{{ .Values.commitSha }}'
          command: ["poetry", "run", "taskiq", "worker"]
          args:
            - "ticketmaster.background_tasks.main:broker"
            - "ticketmaster.background_tasks.tasks"
            - "--workers"
            - "1"
            - "--max-async-tasks"
            - "10"
            - "--wait-tasks-timeout"
            - "65"
            - "--shutdown-timeout"
            - "10"
            - "--no-configure-logging"
          envFrom:
            - secretRef:
                name: ticketmaster
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

argocd:
  meta:
    argocd:
      syncWave: 10
  application:
    repoURL: https://github.com/Rwwwrl/Ticketmaster.git
    targetRevision: env/test-eu

infra:
  meta:
    region: eu-central-1
    argocd:
      syncWave: -10
  externalSecrets:
    serviceAccount:
      roleArn: arn:aws:iam::258167965416:role/ticketmaster-test-eu-eso
  frontend:
    secrets:
      prefix: ticketmaster/frontend/test-eu
  pgbouncer:
    secrets:
      prefix: ticketmaster/pgbouncer/test-eu
  services:
    ticketmaster:
      secrets:
        prefix: ticketmaster/ticketmaster/test-eu

frontend:
  meta:
    argocd:
      syncWave: 0
  image:
    repository: 258167965416.dkr.ecr.eu-central-1.amazonaws.com/frontend
  http:
    replicas: 3

ingress:
  meta:
    argocd:
      syncWave: 0
    certificateArn: arn:aws:acm:eu-central-1:258167965416:certificate/43c8134a-af07-4b42-98e2-6dd086cabee7

pgbouncer:
  meta:
    argocd:
      syncWave: -8
    tiger:
      host: TODO_TIGER_HOST
      port: TODO_TIGER_PORT

services:
  ticketmaster:
    meta:
      argocd:
        syncWave: 0
    image:
      repository: 258167965416.dkr.ecr.eu-central-1.amazonaws.com/ticketmaster
    http:
      hpa:
        minReplicas: 3
        maxReplicas: 5
        cpuTargetPercent: 70
    migrations:
      expand:
        meta:
          argocd:
            syncWave: -5
      contract:
        meta:
          argocd:
            syncWave: 5
